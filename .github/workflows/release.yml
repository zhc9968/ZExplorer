name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-x64:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Validate tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: powershell
        run: |
          $version = (Get-Content -LiteralPath .\VERSION -Raw).Trim()
          $expected = "v$version"
          if ("${{ github.ref_name }}" -ne $expected) {
            throw "Tag ${{ github.ref_name }} does not match VERSION $version"
          }

      - name: Build Release and run platform tests
        shell: powershell
        run: powershell -ExecutionPolicy Bypass -File .\build.ps1

      - name: Package release
        shell: powershell
        run: powershell -ExecutionPolicy Bypass -File .\tools\package_release.ps1

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: ZExplorer-release
          path: |
            release/*.zip
            release/*.sha256
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*.zip
            release/*.sha256
          generate_release_notes: true
          fail_on_unmatched_files: true
